[project]
name = "stillwar"
version = "2.0.0"
description = "Reproducible order-2 log-signature return forecasting and multiplier-free KKT no-trade diagnostics for IDX equities"
readme = "README.md"
requires-python = "==3.14.*"
license = { file = "LICENSE" }
authors = [
    { name = "Muhammad Reihan Pandanarang", email = "mrpandanarang@gmail.com" }
]
keywords = [
    "reproducible-research",
    "portfolio-optimization",
    "log-signature",
    "kkt-conditions",
    "transaction-costs",
    "idx",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "scipy>=1.13.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-regressions>=2.5.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.6.0",
]
download = [
    "yfinance>=0.2.40",
]
tracking = [
    "mlflow>=2.14.0",
]
config = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]
validation = [
    "pandera>=0.20.0",
]
qp = [
    "cvxpy>=1.5.0",
]
pipeline = [
    "dvc>=3.50.0",
]

[project.scripts]
stillwar = "stillwar.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stillwar*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that need the full pipeline or trained checkpoints",
    "integration: end-to-end checks against generated artifacts",
]

[tool.coverage.run]
source = ["stillwar"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "D"]
ignore = [
    "E501",    # line length is handled by the formatter
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "D401",    # imperative mood is not worth enforcing on mathematical prose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "B", "SIM"]
"src/stillwar/__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
