# Pre-commit hooks. Install once with:
#   uv run pre-commit install
# Run on every file with:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: manuscript-check
        name: manuscript structural check
        entry: python tools/check_manuscript.py
        language: system
        pass_filenames: false
