# DVC pipeline for the Stillwater reproducibility stages.
#
# Install the optional pipeline extra and initialise DVC once:
#   uv sync --extra pipeline
#   uv run dvc init
#   uv run dvc repro
#
# The custom content-addressed cache in src/stillwater/provenance/cache.py remains the
# fast path used by `make`; DVC adds standard `dvc.lock` lineage and remote storage.
stages:
  features:
    cmd: uv run python -m stillwater features
    deps:
      - data/raw
      - src/stillwater/features
      - src/stillwater/data
      - configs/base.yaml
    outs:
      - .cache/dataset

  train:
    cmd: uv run python -m stillwater train
    deps:
      - .cache/dataset
      - src/stillwater/models
      - configs/base.yaml
    outs:
      - models/checkpoints
      - data/processed/forecasts_logsig.npz
      - data/processed/forecasts_logsig_inc.npz
      - data/processed/forecasts_mlp.npz
      - data/processed/forecasts_lstm.npz

  baselines:
    cmd: uv run python -m stillwater baselines
    deps:
      - .cache/dataset
      - src/stillwater/features
      - configs/base.yaml
    outs:
      - data/processed/forecasts_baselines.npz

  simulate:
    cmd: uv run python -m stillwater simulate
    deps:
      - data/processed/forecasts_logsig.npz
      - data/processed/forecasts_logsig_inc.npz
      - data/processed/forecasts_mlp.npz
      - data/processed/forecasts_lstm.npz
      - data/processed/forecasts_baselines.npz
      - src/stillwater/experiments
      - src/stillwater/backtest
      - src/stillwater/optimization
      - configs/base.yaml
    outs:
      - data/processed/table1.json
      - data/processed/table2.json
      - data/processed/table3.json
      - data/processed/kkt_log.json
      - data/processed/phase4.json
      - data/processed/gate_weights.json

  experiments:
    cmd: uv run python -m stillwater experiments
    deps:
      - data/processed/forecasts_logsig.npz
      - data/processed/forecasts_baselines.npz
      - src/stillwater/experiments
      - configs/base.yaml
    outs:
      - data/processed/exp_unconstrained_tolerance.json
      - data/processed/exp_shrinkage.json
      - data/processed/exp_volatility_penalty.json

  figures:
    cmd: uv run python -m stillwater figures
    deps:
      - data/processed/table1.json
      - data/processed/table2.json
      - data/processed/table3.json
      - data/processed/kkt_log.json
      - data/processed/phase4.json
      - src/stillwater/reporting
    outs:
      - reports/figures

  trials:
    cmd: uv run python -m stillwater trials
    deps:
      - data/processed/forecasts_logsig.npz
      - data/processed/forecasts_baselines.npz
      - src/stillwater/experiments
      - configs/base.yaml
    outs:
      - data/processed/trials.json
